services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: matchlens
      POSTGRES_USER: satrio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchlens_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satrio -d matchlens"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://satrio:${POSTGRES_PASSWORD:-matchlens_secret}@db:5432/matchlens
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "5181:5181"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m backend.pipeline.seed_db && uvicorn backend.main:app --host 0.0.0.0 --port 5181"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5181/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5181/api}
    ports:
      - "5180:5180"
    depends_on:
      - backend

volumes:
  pgdata:
